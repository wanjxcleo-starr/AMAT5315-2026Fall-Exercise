[package]
name = "spectral-fluid"
version = "0.1.0"
edition = "2024"

[dependencies]
rustfft = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "field"
path = "src/bin/field.rs"

[[bin]]
name = "fluid"
path = "src/bin/fluid.rs"

[[bin]]
name = "line-study"
path = "src/bin/line_study.rs"

[[bin]]
name = "part2-study"
path = "src/bin/part2_study.rs"

[[bin]]
name = "perturb-field"
path = "src/bin/perturb_field.rs"
